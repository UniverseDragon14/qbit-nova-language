name: QBIT NOVA native v0.1

on:
  push:
    paths:
      - "c-implementation/native/**"
      - "c-implementation/specification/**"
      - ".github/workflows/qnova-native.yml"
  pull_request:
    paths:
      - "c-implementation/native/**"
      - "c-implementation/specification/**"
      - ".github/workflows/qnova-native.yml"

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen specification
        run: make -C c-implementation/native check-spec
      - name: Strict build and fresh-checkout tests
        run: >
          make -C c-implementation/native
          CFLAGS="-O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror"
          test
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          make -C c-implementation/native BUILD=build-sanitize
          CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDLIBS="-lm -fsanitize=address,undefined"
          test
